name: Build macOS app

on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-pomodoro-mac
          path: release/*.dmg
          retention-days: 30
